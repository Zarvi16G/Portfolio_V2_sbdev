# /etc/nginx/sites-available/santiagoboada.dev on the VPS (host Nginx in front of the container).
# Before installing, replace __SSL_CERT__ and __SSL_KEY__ with the GoDaddy certificate paths
# (docs/SERVER-SETUP.md, step 7). nginx -t fails while they are still placeholders.
#
# Traffic: visitor -> Cloudflare (proxy, Full strict) -> this Nginx :443 -> container 127.0.0.1:8081

# http -> https (both names)
server {
  listen 80;
  listen [::]:80;
  server_name santiagoboada.dev www.santiagoboada.dev;
  server_tokens off;
  return 301 https://santiagoboada.dev$request_uri;
}

# www -> the main name
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.santiagoboada.dev;
  server_tokens off;

  ssl_certificate     __SSL_CERT__;
  ssl_certificate_key __SSL_KEY__;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://santiagoboada.dev$request_uri;
}

# the site
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name santiagoboada.dev;
  server_tokens off;

  ssl_certificate     __SSL_CERT__;
  ssl_certificate_key __SSL_KEY__;
  ssl_protocols TLSv1.2 TLSv1.3;

  # HSTS (no includeSubDomains / preload for now)
  add_header Strict-Transport-Security "max-age=31536000" always;

  # real visitor IP behind Cloudflare (official ranges: https://www.cloudflare.com/ips/)
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # a static site: no request bodies
  client_max_body_size 1k;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
