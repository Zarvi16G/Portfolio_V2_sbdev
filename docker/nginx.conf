# Container Nginx (nginxinc/nginx-unprivileged): serves dist/ on 8080. TLS, HSTS and the real client IP are
# handled by the host Nginx in front of it (deploy/nginx-santiagoboada.conf).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  autoindex off;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # a static site: only GET and HEAD
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  # hidden files (.git, .env, …) are never served
  location ~ /\. { return 404; }

  # the page itself: always revalidated, so a new deploy shows at once
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";   # only on successful responses (no "always")
  }

  # hashed build files: cached for a year; a missing one is a 404, not the page
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";   # only on successful responses (no "always")
    try_files $uri =404;
  }

  # favicons, the light version images and the 3D font JSON (names without hash): 30 days
  location ~* \.(?:svg|ico|png|webp|json)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";   # only on successful responses (no "always")
    try_files $uri =404;
  }

  # one page: anything else falls back to it
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
