# santiagoboada.dev: static build (npm run build -> dist/) served by Nginx.
# Install: /etc/nginx/sites-available/santiagoboada.dev  (+ symlink in sites-enabled)
# HTTPS:   sudo certbot --nginx -d santiagoboada.dev -d www.santiagoboada.dev
#          (Certbot adds the 443 server and the http -> https redirect to this file)

server {
  listen 80;
  listen [::]:80;
  server_name santiagoboada.dev www.santiagoboada.dev;

  root /var/www/santiagoboada.dev;
  index index.html;

  # one page: anything unknown falls back to it
  location / {
    try_files $uri $uri/ /index.html;
  }

  # the page itself: always revalidated, so a new deploy shows at once
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # hashed build files (index-XXXX.js): cache for a year; a missing one is a 404, not the page
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # favicons, the light version images, the 3D font JSON
  location ~* \.(?:svg|ico|png|webp|json)$ {
    expires 30d;
    try_files $uri =404;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
